name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Stamp TOC version
        run: |
          echo "using version: $VERSION"
          sed -i "s/^## Version:.*/## Version: ${VERSION}-1/" addon/AzerothCamp/AzerothCamp.toc
          grep '^## ' addon/AzerothCamp/AzerothCamp.toc

      - name: Package zip
        run: |
          cd addon
          rm -f AzerothCamp/.pkgmeta
          zip -r "../AzerothCamp-${VERSION}.zip" AzerothCamp
          cd ..
          unzip -l "AzerothCamp-${VERSION}.zip"

      - name: Upload to CurseForge
        continue-on-error: true
        uses: wefhy/curseforge-upload@v3
        with:
          token: ${{ secrets.CF_API_KEY }}
          project_id: '1795582'
          file_path: AzerothCamp-${{ env.VERSION }}.zip
          game_endpoint: 'wow'
          game_versions: '1.60.1'
          release_type: 'release'
          changelog: 'Release ${{ env.VERSION }}'
          changelog_type: 'markdown'
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: AzerothCamp-*.zip
          body: |
            AzerothCamp ${{ env.VERSION }}
            Published to CurseForge as well.
